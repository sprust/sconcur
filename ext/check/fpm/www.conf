; FPM pool for the fork/FPM check. Static children so the workers are forked
; from the master up front — the exact shape the Go runtime cannot survive.
[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

pm = static
pm.max_children = 4

catch_workers_output = yes
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
