; Supervisor config for the `servers` container: one sconcur master, holding the
; three servers (HTTP, socket and WebSocket) and the RabbitMQ consumers as a group
; each. One master is one lock, one journal and one panel.
;
; The program runs the master in the foreground (tests/servers/worker/master.php, which
; builds it from the JSON config; the master itself supervises its own worker pools).
; autorestart=unexpected + exitcodes=0 means a clean stop (`make servers-stop` removes the
; state file → the master shuts down and exits 0) is left down, while a crash (non-zero /
; signal) is restarted.
;
; Runs as the unprivileged image user, so all runtime files live under /tmp.

[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:servers]
command=php -d extension=/sconcur/ext/build/sconcur.so /sconcur/tests/servers/worker/master.php /sconcur/config/sconcur.servers.config.json
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=2
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
