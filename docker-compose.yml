services:
  php:
    container_name: sc-php
    restart: on-failure
    build:
      context: ./docker/php
      args:
        - GROUP_ID=${DOCKER_GROUP_ID}
        - USER_ID=${DOCKER_USER_ID}
    working_dir: /sconcur
    volumes:
      - ./:/sconcur
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["sh", "-c", "echo \"Starting infinite wait loop...\"; while sleep 1; do :; done"]

  # Runs two sconcur masters under supervisor in one container (reuses the php image
  # build): one holding the HTTP, socket and WebSocket pools as three groups, and one
  # for the RabbitMQ consumers. Ports are hardcoded (host 28080->8080 for HTTP,
  # 29100->9100 for socket, 29200->9200 for WebSocket) because the JSON master configs
  # cannot use env vars. Rebuild/recreate it with `make servers-restart`; take the whole
  # servers master with `make servers-{status,stop,reload}`, or one group with
  # `make {http,socket,ws}-server-{status,reload}`.
  servers:
    container_name: sc-servers
    restart: unless-stopped
    build:
      context: ./docker/php
      args:
        - GROUP_ID=${DOCKER_GROUP_ID}
        - USER_ID=${DOCKER_USER_ID}
    working_dir: /sconcur
    volumes:
      - ./:/sconcur
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # 8080/9100/9200 are the HTTP, socket and WebSocket servers, one group each of
      # the `servers` master; 8081 is that master's single panel (the three separate
      # panels it replaced are gone). 9301 is the RabbitMQ master's own panel.
      - "28080:8080"
      - "28081:8081"
      - "29100:9100"
      - "29200:9200"
      - "29301:9301"
    command: ["supervisord", "-c", "/sconcur/docker/servers/config/supervisord.conf"]

  # DB data lives in tmpfs (fast tests, state wiped on container restart). For
  # benchmark sessions on real disk-backed backends: comment the tmpfs blocks,
  # uncomment the named-volume mounts and the top-level `volumes:` section, and
  # reset the state between sessions with `make bench-reset` (writes accumulate
  # across runs otherwise).
  mongodb:
    container_name: sc-mongodb
    image: mongo:8.0.5
    restart: unless-stopped
    command: [ "mongod", "--wiredTigerCacheSizeGB", "1" ]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ADMIN_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ADMIN_PASSWORD}
    ports:
      - ${MONGO_DOCKER_PORT}:27017
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    tmpfs:
      - /data/db:rw,noexec,nosuid,size=1024m
      - /data/configdb:rw,noexec,nosuid,size=512m
    # volumes:
    #   - mongodb-data:/data/db
    #   - mongodb-configdb:/data/configdb

  mysql:
    container_name: sc-mysql
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - ${MYSQL_DOCKER_PORT}:3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 15s
    tmpfs:
      - /var/lib/mysql:rw,noexec,nosuid,size=1024m
    # volumes:
    #   - mysql-data:/var/lib/mysql

  postgres:
    container_name: sc-postgres
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - ${POSTGRES_DOCKER_PORT}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    tmpfs:
      - /var/lib/postgresql/data:rw,noexec,nosuid,size=1024m
    # volumes:
    #   - postgres-data:/var/lib/postgresql/data

  rabbitmq:
    container_name: sc-rabbitmq
    image: rabbitmq:4.1-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - ${RABBITMQ_DOCKER_PORT}:5672
      - ${RABBITMQ_MANAGEMENT_DOCKER_PORT}:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 20s
    tmpfs:
      - /var/lib/rabbitmq:rw,noexec,nosuid,size=512m
    # volumes:
    #   - rabbitmq-data:/var/lib/rabbitmq

# volumes:
#   mongodb-data:
#   mongodb-configdb:
#   mysql-data:
#   postgres-data:
#   rabbitmq-data:
